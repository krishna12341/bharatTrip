{% extends 'layout.html' %}

{% block content %}
<div class="card shadow-sm p-4">
  <h3>Create Refund Ticket</h3>
  <form method="post" enctype="multipart/form-data">
    <div class="row gx-3">
      <div class="col-md-6 mb-3">
        <label class="form-label">Customer Name</label>
        <input name="customer_name" class="form-control" required />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Agent Name</label>
        <input name="agent_name" class="form-control" />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Customer Email</label>
        <input name="customer_email" type="email" class="form-control" required />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Customer Phone</label>
        <input name="customer_phone" class="form-control" />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Booking ID</label>
        <input name="booking_id" class="form-control" required />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Booking Date</label>
        <input name="booking_date" type="date" class="form-control" />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Cancellation Date</label>
        <input name="cancellation_date" type="date" class="form-control" />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Refund Amount</label>
        <input name="refund_amount" type="number" step="0.01" class="form-control" required />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Approved Amount</label>
        <input name="approved_amount" type="number" step="0.01" class="form-control" />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Currency</label>
        <input name="currency" class="form-control" value="INR" />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Priority</label>
        <select name="priority" class="form-select">
          <option>Low</option>
          <option selected>Medium</option>
          <option>High</option>
          <option>Critical</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Assigned User</label>
        <select name="assigned_user_id" class="form-select">
          <option value="">Unassigned</option>
          {% for user in users %}
          <option value="{{ user.id }}">{{ user.username }} ({{ user.role }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 mb-3">
        <label class="form-label">Reason</label>
        <textarea name="reason" class="form-control" rows="3"></textarea>
      </div>
      <div class="col-12 mb-3">
        <label class="form-label">Support Notes</label>
        <textarea name="support_notes" class="form-control" rows="3"></textarea>
      </div>
      <div class="col-12 mb-3">
        <label class="form-label">Attachments</label>
        <input name="attachments" type="file" class="form-control" multiple />
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary">Save Ticket</button>
      <a href="{{ url_for('tickets.list_tickets') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
